task: ruhhh_image
task_alias: ruhhh_image

dataset_path: MERA-evaluation/ruHHH-Image
validation_split: shots
test_split: test

output_type: generate_until
doc_to_image: !function utils.doc_to_image
doc_to_text: !function utils.doc_to_text
doc_to_target: "{{outputs}}"

process_results: !function utils.process_results

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: judge_score
    aggregation: mean
    higher_is_better: true
  - metric: group_exact_match
    aggregation: !function utils.aggregate_group_score
    higher_is_better: true
  - metric: grpup_judge_score
    aggregation: !function utils.aggregate_group_score
    higher_is_better: true

metadata:
  version: 1.0
